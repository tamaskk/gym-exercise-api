# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the API as an always-on Node web service. The database is external
# (MongoDB Atlas), so only the app is hosted here.
services:
  - type: web
    name: exercise-api
    runtime: node
    plan: free
    # Build needs dev deps (nest cli, typescript); npm ci installs them.
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    # Render pings this; our liveness route returns 200 when Mongo is reachable.
    healthCheckPath: /api/v1/liveness
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Secret — set the real Atlas URI in the Render dashboard, not in git.
      # Include a db name in the path, e.g. .../exercise-api
      - key: MONGODB_URI
        sync: false
      - key: SOURCE_API_BASE_URL
        value: https://oss.exercisedb.dev/api/v1
      - key: SOURCE_API_TIMEOUT_MS
        value: "15000"
      - key: SYNC_PAGE_SIZE
        value: "25"
      - key: SYNC_REQUEST_DELAY_MS
        value: "250"
      - key: SYNC_MAX_RETRIES
        value: "5"
    # NOTE: do NOT set PORT — Render injects it and main.ts reads process.env.PORT.
